name: Architecture Tests

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run architecture tests
        shell: pwsh
        run: ./tests/Architecture.Tests.ps1
      - name: Run current Profile registry tests
        shell: pwsh
        run: ./tests/DistroShelf.Tests.ps1
      - name: Run Track registry tests
        shell: pwsh
        run: ./tests/DistroTrack.Tests.ps1
      - name: Run Ubuntu Track contract tests
        shell: pwsh
        run: ./tests/UbuntuTrack.Tests.ps1

  ubuntu-live:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[live]') }}
    needs: architecture
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Ubuntu live Track integration
        shell: pwsh
        env:
          DISTROSHELF_RUN_LIVE_TESTS: '1'
        run: ./tests/UbuntuLive.Tests.ps1

# [live] one-shot integration gate; subsequent normal pushes skip ubuntu-live.
