name: Architecture Tests

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run architecture tests
        shell: pwsh
        run: ./tests/Architecture.Tests.ps1
      - name: Run Profile atomicity tests
        shell: pwsh
        run: ./tests/ProfileAtomicity.Tests.ps1
      - name: Run Track atomicity tests
        shell: pwsh
        run: ./tests/TrackAtomicity.Tests.ps1
      - name: Run Ubuntu reference tests
        shell: pwsh
        run: ./tests/UbuntuReference.Tests.ps1
      - name: Run Ubuntu execution-boundary tests
        shell: pwsh
        run: ./tests/UbuntuExecution.Tests.ps1
